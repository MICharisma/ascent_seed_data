# The records every other manifest builds on: the country and the coded Positions of the catalog.
# Hand-curated and loaded before every other manifest. A Position is a role, such as Mayor or County Executive;
# its Offices supply the place. Other data files, like conversion/2026/<state>/offices.yml, name Positions by code.
# Add a Position here before using its code anywhere else.
format: micharisma-seeds/v1
namespace: MIC
catalog: ASC
records:
- type: Country
  code: COUNTRY-USA
  attributes:
    code: US
    name: United States

# Federal and state offices.
- type: Position
  code: POSITION-PRESIDENT
  attributes:
    title: President
    description: The chief executive officer of a country, responsible for implementing and enforcing laws, leading the executive branch, and serving as commander-in-chief of the armed forces.
    branch: executive
    term_length_years: 4
- type: Position
  code: POSITION-SENATOR
  attributes:
    title: Senator
    description: A member of the upper house of a legislature, typically representing larger geographic areas and serving longer terms than representatives.
    branch: legislative
    term_length_years: 6
- type: Position
  code: POSITION-REPRESENTATIVE
  attributes:
    title: Representative
    description: A member of the lower house of a legislature, representing specific districts and serving as the direct voice of constituents in the legislative process.
    branch: legislative
    term_length_years: 2
- type: Position
  code: POSITION-GOVERNOR
  attributes:
    title: Governor
    description: The chief executive officer of a state or province, responsible for implementing state laws, overseeing state agencies, and serving as the ceremonial head of state.
    branch: executive
    term_length_years: 4
- type: Position
  code: POSITION-LIEUTENANT_GOVERNOR
  attributes:
    title: Lieutenant Governor
    description: The second-ranking executive officer of a state, first in line to succeed the governor.
    branch: executive
- type: Position
  code: POSITION-ATTORNEY_GENERAL
  attributes:
    title: Attorney General
    description: The chief legal officer responsible for representing the government in legal matters, overseeing law enforcement agencies, and providing legal counsel to government officials.
    branch: executive
    term_length_years: 4
- type: Position
  code: POSITION-SECRETARY_OF_STATE
  attributes:
    title: Secretary of State
    description: An official responsible for overseeing elections, maintaining public records, and often serving as the chief administrative officer for state government.
    branch: executive
    term_length_years: 4
- type: Position
  code: POSITION-TREASURER
  attributes:
    title: Treasurer
    description: The officer who manages public funds and investments for a state, county, or town, and accounts for their use.
    branch: executive
- type: Position
  code: POSITION-COMPTROLLER
  attributes:
    title: Comptroller
    description: The officer who audits a state's or county's spending and accounts for its public funds.
    branch: executive
- type: Position
  code: POSITION-AUDITOR
  attributes:
    title: Auditor
    description: A statewide officer who audits state agencies and the programs they run.
    branch: executive
- type: Position
  code: POSITION-CHIEF_FINANCIAL_OFFICER
  attributes:
    title: Chief Financial Officer
    description: A statewide officer who manages state finances, accounting, and payments.
    branch: executive
- type: Position
  code: POSITION-COMMISSIONER_OF_AGRICULTURE
  attributes:
    title: Commissioner of Agriculture
    description: A statewide officer who oversees agriculture, consumer protection, and related regulation.
    branch: executive
- type: Position
  code: POSITION-GOVERNORS_COUNCILLOR
  attributes:
    title: Governor's Councillor
    description: A member of an elected council that advises the governor and confirms judicial appointments and pardons.
    branch: executive
- type: Position
  code: POSITION-STATE_SENATOR
  attributes:
    title: State Senator
    description: A member of the upper house of a state legislature, elected from a state senate district.
    branch: legislative
- type: Position
  code: POSITION-STATE_REPRESENTATIVE
  attributes:
    title: State Representative
    description: A member of the lower house of a state legislature (called the Assembly or House of Delegates in some states), elected from a district.
    branch: legislative
- type: Position
  code: POSITION-STATE_ATTORNEY
  attributes:
    title: State Attorney
    description: The elected prosecutor for a judicial circuit.
    branch: executive
- type: Position
  code: POSITION-PUBLIC_DEFENDER
  attributes:
    title: Public Defender
    description: The elected officer who provides legal defense to people who cannot afford a lawyer within a judicial circuit.
    branch: executive

# Courts.
- type: Position
  code: POSITION-JUSTICE
  attributes:
    title: Justice
    description: A member of a court, responsible for hearing cases, interpreting law, and reviewing decisions of lower courts.
    branch: judicial
    term_length_years: 12
- type: Position
  code: POSITION-APPELLATE_JUDGE
  attributes:
    title: Appellate Judge
    description: A judge of an intermediate appellate court who reviews decisions of trial courts.
    branch: judicial
- type: Position
  code: POSITION-CIRCUIT_JUDGE
  attributes:
    title: Circuit Judge
    description: A judge of a state trial court of general jurisdiction, elected within a judicial circuit.
    branch: judicial
- type: Position
  code: POSITION-COUNTY_JUDGE
  attributes:
    title: County Judge
    description: A judge of a county court, which hears lesser criminal cases, civil disputes, and other matters assigned by state law.
    branch: judicial
- type: Position
  code: POSITION-FAMILY_COURT_JUDGE
  attributes:
    title: Family Court Judge
    description: A judge of a family court, which hears custody, support, abuse, and juvenile cases.
    branch: judicial
- type: Position
  code: POSITION-SURROGATE
  attributes:
    title: Surrogate
    description: A judge of a surrogate's court, which handles wills, estates, guardianships, and adoptions.
    branch: judicial
- type: Position
  code: POSITION-DISTRICT_COURT_JUDGE
  attributes:
    title: District Court Judge
    description: A judge of a district court, which hears lesser criminal and civil cases within part of a county.
    branch: judicial
- type: Position
  code: POSITION-CIVIL_COURT_JUDGE
  attributes:
    title: Civil Court Judge
    description: A judge of a city civil court, which hears lawsuits up to a set amount and landlord-tenant cases.
    branch: judicial
- type: Position
  code: POSITION-CITY_COURT_JUDGE
  attributes:
    title: City Court Judge
    description: A judge of a city court, which hears lesser criminal cases, small claims, and traffic matters within a city.
    branch: judicial
- type: Position
  code: POSITION-TOWN_JUSTICE
  attributes:
    title: Town Justice
    description: A local magistrate who hears traffic, small-claims, and lesser criminal cases arising in a town.
    branch: judicial
- type: Position
  code: POSITION-VILLAGE_JUSTICE
  attributes:
    title: Village Justice
    description: A local magistrate who hears traffic, small-claims, and lesser criminal cases arising in a village.
    branch: judicial
- type: Position
  code: POSITION-JUDGE_OF_PROBATE
  attributes:
    title: Judge of Probate
    description: A judge of a probate court, which handles wills, estates, guardianships, and conservatorships.
    branch: judicial
- type: Position
  code: POSITION-REGISTER_OF_PROBATE
  attributes:
    title: Register of Probate
    description: The officer who keeps the records of a county's probate and family court.
    branch: judicial
- type: Position
  code: POSITION-CLERK_OF_COURT
  attributes:
    title: Clerk of Court
    description: The officer who keeps a county's court records and, in many states, its land records and public funds.
    branch: judicial

# County offices.
- type: Position
  code: POSITION-COUNTY_EXECUTIVE
  attributes:
    title: County Executive
    description: The elected chief executive of a county, who runs its departments, proposes its budget, and can veto its legislature.
    branch: executive
- type: Position
  code: POSITION-COUNTY_COMMISSIONER
  attributes:
    title: County Commissioner
    description: A member of a county's governing commission, which sets its budget and ordinances and oversees county services.
    branch: legislative
- type: Position
  code: POSITION-COUNTY_LEGISLATOR
  attributes:
    title: County Legislator
    description: A member of a county legislature, which adopts the county's budget and local laws.
    branch: legislative
- type: Position
  code: POSITION-COUNTY_SUPERVISOR
  attributes:
    title: County Supervisor
    description: A member of a county's board of supervisors, which sets its budget and ordinances and oversees county services.
    branch: legislative
- type: Position
  code: POSITION-COUNTY_BOARD_CHAIR
  attributes:
    title: County Board Chair
    description: The member who presides over a county's governing board, elected countywide.
    branch: legislative
- type: Position
  code: POSITION-COUNTY_BOARD_MEMBER
  attributes:
    title: County Board Member
    description: A member of a county board, such as a county governing board or a charter review board.
    branch: legislative
- type: Position
  code: POSITION-COUNTY_OFFICER
  attributes:
    title: County Officer
    description: A county office that the ballot source lists only generically, such as a county mayor, chair, or attorney.
    branch: executive
- type: Position
  code: POSITION-COUNTY_CLERK
  attributes:
    title: County Clerk
    description: The officer who keeps a county's official records, such as deeds, court filings, and licenses.
    branch: executive
- type: Position
  code: POSITION-SHERIFF
  attributes:
    title: Sheriff
    description: The chief law enforcement officer for a county, responsible for maintaining public safety, operating detention facilities, and serving legal processes.
    branch: executive
    term_length_years: 4
- type: Position
  code: POSITION-CORONER
  attributes:
    title: Coroner
    description: The officer who investigates sudden, violent, or unexplained deaths in a county.
    branch: executive
- type: Position
  code: POSITION-DISTRICT_ATTORNEY
  attributes:
    title: District Attorney
    description: The elected prosecutor for a county or prosecutorial district.
    branch: executive
- type: Position
  code: POSITION-COMMONWEALTHS_ATTORNEY
  attributes:
    title: Commonwealth's Attorney
    description: The elected prosecutor for a Virginia county or city.
    branch: executive
- type: Position
  code: POSITION-COMMISSIONER_OF_REVENUE
  attributes:
    title: Commissioner of Revenue
    description: The officer who assesses property and income for local taxes in a Virginia county or city.
    branch: executive
- type: Position
  code: POSITION-TAX_COLLECTOR
  attributes:
    title: Tax Collector
    description: The officer who collects property and other local taxes for a county or town.
    branch: executive
- type: Position
  code: POSITION-RECEIVER_OF_TAXES
  attributes:
    title: Receiver of Taxes
    description: The officer who collects property taxes for a town.
    branch: executive
- type: Position
  code: POSITION-SUPERVISOR_OF_ELECTIONS
  attributes:
    title: Supervisor of Elections
    description: The officer who runs a county's elections and keeps its voter rolls.
    branch: executive
- type: Position
  code: POSITION-REGISTRAR_OF_VOTERS
  attributes:
    title: Registrar of Voters
    description: An officer who keeps a town's voter rolls and runs its elections, one from each major party.
    branch: executive
- type: Position
  code: POSITION-COUNTY_CHARTER_COMMISSIONER
  attributes:
    title: County Charter Commissioner
    description: A member of a commission elected to draft or revise a county's charter.
    branch: legislative
- type: Position
  code: POSITION-COUNTY_ASSEMBLY_DELEGATE
  attributes:
    title: County Assembly Delegate
    description: A town's delegate to a county assembly, which adopts the county's ordinances and budget.
    branch: legislative

# City, town, and village offices.
- type: Position
  code: POSITION-MAYOR
  attributes:
    title: Mayor
    description: The chief executive of a city, town, or village, who leads its administration and, in many places, presides over its council or commission.
    branch: executive
- type: Position
  code: POSITION-VICE_MAYOR
  attributes:
    title: Vice Mayor
    description: The officer who acts for the mayor in the mayor's absence, elected separately in some towns.
    branch: executive
- type: Position
  code: POSITION-COUNCIL_MEMBER
  attributes:
    title: Council Member
    description: A member of a city, town, or village council, which adopts local ordinances and the budget.
    branch: legislative
- type: Position
  code: POSITION-COMMISSIONER
  attributes:
    title: Commissioner
    description: A member of a city, town, or village commission, which adopts local ordinances and the budget.
    branch: legislative
- type: Position
  code: POSITION-TOWN_SUPERVISOR
  attributes:
    title: Town Supervisor
    description: The chief executive of a town, who presides over its board and manages its finances.
    branch: executive
- type: Position
  code: POSITION-VILLAGE_TRUSTEE
  attributes:
    title: Village Trustee
    description: A member of a village's board of trustees, which adopts its local laws and budget.
    branch: legislative
- type: Position
  code: POSITION-TOWN_TRUSTEE
  attributes:
    title: Town Trustee
    description: A member of a town's board of trustees, which manages town-owned lands and waters.
    branch: legislative
- type: Position
  code: POSITION-TOWN_CLERK
  attributes:
    title: Town Clerk
    description: The officer who keeps a town's records and issues its licenses and permits.
    branch: executive
- type: Position
  code: POSITION-TOWN_CLERK_AND_TAX_COLLECTOR
  attributes:
    title: Town Clerk and Tax Collector
    description: A combined office that keeps a town's records and collects its taxes.
    branch: executive
- type: Position
  code: POSITION-HIGHWAY_SUPERINTENDENT
  attributes:
    title: Highway Superintendent
    description: The officer who maintains a town's roads, including plowing and repairs.
    branch: executive
- type: Position
  code: POSITION-CITY_MARSHAL
  attributes:
    title: City Marshal
    description: An elected city law enforcement officer.
    branch: executive
- type: Position
  code: POSITION-RECORDER
  attributes:
    title: Recorder
    description: The officer who keeps a town council's minutes and records.
    branch: executive
- type: Position
  code: POSITION-REPRESENTATIVE_TOWN_MEETING_MEMBER
  attributes:
    title: Representative Town Meeting Member
    description: A member elected from a district to a town's representative town meeting, its legislative body.
    branch: legislative
- type: Position
  code: POSITION-COMMUNITY_COUNCIL_MEMBER
  attributes:
    title: Community Council Member
    description: A member of a community council that advises a county on zoning and land use in part of its unincorporated area.
    branch: legislative
- type: Position
  code: POSITION-SCHOOL_BOARD_MEMBER
  attributes:
    title: School Board Member
    description: A member of a school board or board of education, which sets policy and the budget for a school district.
    branch: legislative
- type: Position
  code: POSITION-LIBRARY_TRUSTEE
  attributes:
    title: Library Trustee
    description: A member of the board that governs a public library or library district.
    branch: executive

# Regional bodies.
- type: Position
  code: POSITION-REGIONAL_COMMISSION_MEMBER
  attributes:
    title: Regional Commission Member
    description: A member of a regional planning and regulatory commission.
    branch: executive
- type: Position
  code: POSITION-COUNCIL_OF_GOVERNMENTS_EXECUTIVE_COMMITTEE_MEMBER
  attributes:
    title: Council of Governments Executive Committee Member
    description: A member of the executive committee of a regional council of governments.
    branch: executive

# Special districts. An office's seat names the district when its county has more than one.
- type: Position
  code: POSITION-COMMUNITY_DEVELOPMENT_DISTRICT_SUPERVISOR
  attributes:
    title: Community Development District Supervisor
    description: A member of the board of supervisors of a community development district, which finances and maintains a development's infrastructure.
    branch: legislative
- type: Position
  code: POSITION-SOIL_AND_WATER_CONSERVATION_DISTRICT_SUPERVISOR
  attributes:
    title: Soil and Water Conservation District Supervisor
    description: A member of the board of a soil and water conservation district, which promotes conservation of soil, water, and natural resources.
    branch: executive
- type: Position
  code: POSITION-FIRE_DISTRICT_COMMISSIONER
  attributes:
    title: Fire District Commissioner
    description: A member of the board that governs a fire control or fire rescue district.
    branch: executive
- type: Position
  code: POSITION-MOSQUITO_CONTROL_COMMISSIONER
  attributes:
    title: Mosquito Control Commissioner
    description: A member of the board that governs a mosquito control district.
    branch: executive
- type: Position
  code: POSITION-HOSPITAL_BOARD_MEMBER
  attributes:
    title: Hospital Board Member
    description: A member of the board that governs a public hospital district or authority.
    branch: executive
- type: Position
  code: POSITION-PORT_COMMISSIONER
  attributes:
    title: Port Commissioner
    description: A member of the board that governs a port authority or port district.
    branch: executive
- type: Position
  code: POSITION-AIRPORT_AUTHORITY_MEMBER
  attributes:
    title: Airport Authority Member
    description: A member of the board that governs an airport authority.
    branch: executive
- type: Position
  code: POSITION-SPECIAL_DISTRICT_BOARD_MEMBER
  attributes:
    title: Special District Board Member
    description: A member of the board of a special district, such as an improvement, water control, recreation, or utility district.
    branch: executive
