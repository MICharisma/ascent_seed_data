- type: Race
  code: RACE-USA-MS-HOUSE-HD_70-2026_SPECIAL
  attributes:
    status: upcoming
    description: 'Vote for: 1. SPECIAL ELECTION for State House of Representatives District 70, Nov 3, 2026, to fill a vacancy for the rest of the term ending January 2028. Candidates per the Secretary of State''s sample official ballot (https://www.sos.ms.gov/content/documents/Elections/2026/Sample%20Ballot%209-9-26.pdf) and candidate qualifying list (https://sos.ms.gov/content/CandidateQualifying/default.aspx). Mississippi special elections to fill legislative vacancies are nonpartisan (Miss. Code 23-15-833): candidates qualify by petition without party primaries and the ballot prints each as ''Independent''. If no candidate wins a majority, a runoff follows (Miss. Code 23-15-833). Mississippi''s regular legislative elections are in odd years (2023, 2027); no regular House or Senate seats are on the 2026 ballot.'
  references:
    election: ELECTION-USA-MS-HOUSE-HD_70-2026_GENERAL
    office: OFFICE-USA-MS-HOUSE-HD_70
