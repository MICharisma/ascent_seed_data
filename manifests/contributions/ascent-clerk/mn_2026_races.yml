- type: Race
  code: RACE-USA-MN-GOVERNOR-2026_GENERAL
  attributes:
    status: upcoming
    description: 'Minnesota elects the Governor and Lieutenant Governor jointly: candidates file as a ticket, and both the Aug 11 primary and the Nov 3 general ballot list them together, with one vote for both (Minn. Const. art. V sec. 1; Minn. Stat. 204D.10). The Secretary of State results files list each ticket as one candidate under ''Governor & Lt Governor''. Ascent has no ticket record, so the two offices keep separate races and candidacies, paired by ticket. Vote for: 1. Candidates per the Minnesota Secretary of State 2026 State General Election candidate file (https://electionresultsfiles.sos.mn.gov/20261103/cand.txt; office title ''Governor & Lt Governor'').'
