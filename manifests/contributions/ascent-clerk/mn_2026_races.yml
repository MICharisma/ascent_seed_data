# Minnesota 2026: Governor, Supreme Court and Court of Appeals seats, state Senate and state House offices and general races, plus a party nomination office (POSITION-NOMINEE, nominee_count 1) and an Aug 11 primary race for every contest and major party in the Secretary of State primary candidate file (including existing US Senate, US House, Lt Governor, SoS, AG and Auditor offices).
