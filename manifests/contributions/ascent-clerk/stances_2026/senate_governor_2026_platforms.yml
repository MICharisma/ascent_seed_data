te equity consolidation in health care, housing, and groceries, and clawbacks on economic-development incentives. For workers, he supports strengthening the right to organize, fully funding the NLRB, OSHA, and NIOSH, cracking down on wage theft, and the No Robot Bosses Act requiring human review of AI-driven employment decisions.
