  code: COMMUNICATION-WEB-GREGABBOTT_COM-2026_10_31-ISSUES
  attributes:
    kind: platform
    title: Greg Abbott 2026 governor campaign platform (Texas)
    published_on: '2026-10-01'
    url: https://www.gregabbott.com/policy/
    availability: available
    summary: Governor Abbott's agenda, "Stronger Texas. Brighter Tomorrow.", promises more savings, opportunity, and freedom. On property taxes, he would let voters decide whether to abolish school district property taxes with the state funding schools, appraise property only once every five years, extend the 10 percent appraisal cap to all properties, allow rollback elections on a 15 percent petition, limit local spending growth to population plus inflation or 3.5 percent, and require two-thirds voter approval for local tax increases. On housing, he would cut red tape and allow additions by right. On health care, he would cap co-pays at $25 and lower premiums by reducing insurance mandates. He would open city utility monopolies to retail electric competition. On public safety, he would expand DPS operations against repeat offenders, deny bail to illegal immigrants arrested for violent felonies, and allow impeachment of district attorneys who fail their oath. He proposes $500 off summer college tuition and accelerated 90-credit-hour degrees, and aims to make Texas first in reading and math through reading and math academies and targeted support, directing funding to classrooms and teachers.
    language: en
    featured_candidacies:
    - CANDIDACY-USA-TX-GOVERNOR-2026_GENERAL-ABBOTT_GR_9G
