    title: Christine Drazan 2026 governor campaign platform (Oregon)
    published_on: '2026-08-13'
    url: https://www.christinefororegon.com/drazan-plan/
    availability: available
    summary: Drazan's "Drazan Plan" says Oregon cannot keep doing the same thing and expect different results. On cost of living, she would issue a Day One Affordability Executive Order to identify and suspend costly rules beyond state or federal requirements, repeal the Climate Protection Program order, veto new tax and fee increases, reform the Corporate Activity Tax, cut property taxes for veterans and seniors, and protect the kicker. On the economy, she would freeze new regulations, create a Small Business Bill of Rights, establish a recurring $200 million site-readiness fund, prioritize reliable, technology-neutral energy, increase sustainable timber production, and expand apprenticeships and career and technical education. On homelessness and addiction, she would audit spending, prioritize recovery and treatment, raise penalties for drug traffickers, and declare a state of emergency on addiction and mental health. On housing, she proposes a 120-day maximum decision period for qualifying projects, a Housing Permit Command Center, and first-time buyer help. On education, she would restore graduation requirements, require third-grade reading proficiency, and support school choice. She would create an Office of Government Accountability and require data centers to sign community benefit agreements.
