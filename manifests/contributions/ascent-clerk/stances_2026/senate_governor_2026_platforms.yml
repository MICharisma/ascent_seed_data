    summary: Wilson's issues page focuses on education and the Permanent Fund Dividend. On education, she says Alaska's one-size-fits-all system is failing children and creates income-based inequality, since wealthier families can afford private schools and tutors. She questions increases to the Base Student Allocation that she says are not tied to measurable outcomes while Alaska ranks among the top states in per-pupil spending and near the bottom in reading and math, and calls for transparency, accountability, and funding tied to results. She urges serious consideration of education savings accounts, "backpack" funding that follows the student, and other learn-anywhere models. On the Permanent Fund Dividend, she says Alaskans are owners and shareholders of the state's resources and that the dividend is not welfare or an entitlement. She argues that lawmakers have withheld thousands of dollars owed to Alaskans under the statutory formula and spent the money elsewhere with little transparency, and that they should follow the law or change it through the proper legislative process.
