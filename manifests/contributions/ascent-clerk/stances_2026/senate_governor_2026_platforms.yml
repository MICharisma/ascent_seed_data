lacement, strengthen antitrust enforcement against big tech, protect data privacy, and require AI chatbot safety protocols, disclosure, bans on impersonating licensed professionals, and independent testing before products reach children. On foreign policy, she favors diplomacy and restraint, ending the war in Iran, multilateralism through the UN, a peace for Palestinians and Israelis based on equality and international law, surging humanitarian aid to crisis areas, enforcing the Leahy Law, and restoring UN and humanitarian funding. On justice and immigration, she supports ending mass incarceration, federal marijuana decriminalization, demilitarizing police, a path to citizenship for Dreamers and undocumented residents, a deportation moratorium pending an audit, abolishing and rebuilding ICE, ending for-profit prisons, and requiring warrants for surveillance data.
