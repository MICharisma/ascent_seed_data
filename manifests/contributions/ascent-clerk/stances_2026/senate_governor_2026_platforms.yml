    title: David Crowley 2026 governor campaign platform (Wisconsin)
    published_on: '2026-10-31'
    url: https://www.crowleyforwi.com/plan
    availability: available
    summary: Crowley, the Milwaukee County executive, says his campaign aims to improve life for working Wisconsinites in every zip code. He would grow an economy built on local ownership and union labor, take his Building Bridges storefront and commercial corridor program statewide, and modernize apprenticeships and technical training. He would streamline permitting for small businesses, back community lenders, and attach clear expectations to public investments. On health care, he would expand mobile outreach, addiction treatment, and EMS innovation. He would build and preserve energy-efficient affordable housing statewide. On education, he supports universal early childhood education, new public school investment, and closing the special education reimbursement gap. He frames climate action as economic investment in solar, energy retrofits, and clean infrastructure. He would close the broadband gap, repair roads, expand transit, give local governments new revenue tools while lowering property taxes, protect voting rights, and push nonpartisan redistricting. On child care, he proposes paid family leave, direct provider support, and a 7 percent cap on families' child care costs, and he supports home- and community-based disability services.
