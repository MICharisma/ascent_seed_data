    summary: 'Cooper''s campaign site does not include an issues page. His homepage statement says that for too many Americans the middle class feels like a distant dream while the biggest corporations and richest Americans have grabbed unimaginable wealth, and that he is running for Senate to change that. His biography highlights his record as governor: job growth, hundreds of bipartisan bills, a bipartisan agreement to expand Medicaid, a plan incentivizing hospitals to relieve more than $4 billion in medical debt and prevent new debt, and focus on public education, the opioid crisis, rural revitalization, and job training. It also cites his earlier work as attorney general against scammers, predatory lenders, drug companies, and big banks, and as a legislator on teacher pay, law enforcement, and children''s health insurance.'
