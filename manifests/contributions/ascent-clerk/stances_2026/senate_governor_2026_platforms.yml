    summary: El-Sayed, a physician and former Detroit and Wayne County public health official, says his campaign takes no corporate money and centers on getting money out of politics, putting money in people's pockets, and passing Medicare for All. On democracy, he supports overturning Citizens United, banning super PAC and corporate outside spending, nonpartisan congressional redistricting, Supreme Court reform, abolishing the filibuster, and automatic voter registration at 18, and opposes the SAVE Act. On the environment, he would hold polluters accountable, codify the Endangerment Finding, protect the Great Lakes, and create a federal guarantee of clean, affordable water, citing Flint and PFAS. On foreign policy, he supports Ukraine, opposes the war in Iran, opposes blank-check military aid to foreign governments including Israel, and calls for ending what he describes as U.S.-backed genocide in Gaza. On the economy, he supports domestic manufacturing, NIH and NSF research, strong antitrust enforcement, and taxing billionaire wealth. On AI, he supports public oversight, safety testing, and federal zoning guidelines for data centers. He calls for a housing building boom, universal child care and pre-K, fully funding IDEA, and redirecting farm support to family farmers.
