    summary: Hamilton, a fifth-generation Kansan, centers his campaign on affordability and cleaning up corruption in Washington. On energy costs, he calls for ending what he calls self-destructive tariffs and unnecessary wars and requiring data centers to pay their fair share of electricity costs. For seniors, he proposes prioritizing home-based care reimbursement and adding vision and dental to Medicare. On housing, he supports requiring congressional approval for tariffs, modernizing modular-home rules, banning Wall Street purchases of single-family homes, first-time buyer tax credits, and stopping algorithmic rent-pricing collusion. On health care, he backs investing in rural hospitals, reforming medical billing and debt, protecting a woman's right to choose, and codifying contraception access. On agriculture, he calls for a full farm bill, year-round H-2A visas, domestic fertilizer production, and year-round E15. On government reform, he proposes banning stock and crypto trading and prediction-market betting by members of Congress, term and age limits for Congress and the Supreme Court, curbing dark money, and withholding member pay during shutdowns. He supports banning junk fees, strengthening the right to organize, and the No Robot Bosses Act requiring human review of AI employment decisions.
