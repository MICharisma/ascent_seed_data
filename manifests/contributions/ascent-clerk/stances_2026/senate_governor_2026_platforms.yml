    summary: Andrews, a pediatrician and mother, organizes her platform around six issues. On the economy, she says families are falling behind as prices climb, and pledges to end tax breaks for the ultra-wealthy and corporate polluters, raise wages and strengthen workers' rights, expand affordable child care and paid family leave, and restore trade policies that protect South Carolina jobs and farms. On gun violence, drawing on caring for children who survived shootings, she says the Second Amendment can be respected while protecting children, and supports banning "weapons of war," safe storage laws to prevent unintentional shootings and youth suicides, and more funding for community violence prevention and mental health programs. On corruption, she takes no corporate PAC money and supports banning corporate PAC and dark money, barring members of Congress from trading stocks, term limits and stronger ethics rules, protecting voting rights and fairer elections, and standing up to anyone in either party who puts power over people. Calling health care a right, she supports a public option, more accessible and affordable mental health care, protecting and expanding Medicaid and Medicare, lower drug prices, restoring scientific research funding, and stronger vaccine access and public-health preparedness. On reproductive freedom, she opposes South Carolina's proposed abortion restrictions and pledges to restore the protections of Roe v. Wade, guarantee access to contraception and infertility care, and expand maternal health services, especially in rural areas. On schools and child care, she would invest in modern classrooms, technology, and school safety, fully fund public schools and special education, expand affordable child care and early learning, raise pay for teachers and staff, and protect and expand free and reduced-price school meals.
