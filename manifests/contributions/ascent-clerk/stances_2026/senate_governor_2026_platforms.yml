    summary: Colom, a district attorney and seventh-generation Mississippian, says hardworking Mississippians deserve a senator who works for them. On costs, he would vote to take back Congress's power over tariffs, require a congressional vote before the country goes to war, and seek a seat on the Agriculture Committee. On wages, he supports raising the minimum wage and tying it to the cost of living and working to end federal income tax for Mississippians earning under $75,000, starting with teachers and law enforcement officers. On health care, he would vote to cancel Medicaid cuts to keep rural emergency and delivery rooms open, restore ACA premium tax credits, and restore federal ACA funding to encourage Mississippi to expand Medicaid. On data centers and AI, he supports pausing new data center construction until companies agree to pay for their own power and water, disclose deals before signing, and commit in writing to hire Mississippi workers; ensuring a real person answers when AI makes decisions about people's lives; and protecting communities' final say over data centers. On ethics, he supports banning stock trading by members of Congress, spouses, and dependent children, barring senators from taking money from companies under federal investigation, funding a Senate ethics office with real enforcement power, overturning Citizens United, and holding regular town halls. On public safety, citing ten years as a prosecutor, he pledges to back law enforcement with pay and tools, secure the border and enforce immigration laws, and hold the powerful to the same laws as everyone else.
    language: en
