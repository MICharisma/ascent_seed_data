  code: COMMUNICATION-WEB-BIGGSFORARIZONA_COM-2026_10_31-ISSUES
  attributes:
    kind: platform
    title: Andy Biggs 2026 governor campaign platform (Arizona)
    published_on: '2026-10-19'
    url: https://biggsforarizona.com/issues/
    availability: available
    summary: Biggs's platform has six themes. To make Arizona affordable, he would eliminate the state income tax, work with localities to reduce property taxes, lower construction costs by streamlining permitting and ending what he calls Governor Hobbs's anti-homebuilding policies, pursue reliable energy including nuclear, stop Wall Street from buying up homes, and end state incentives for data centers while setting water and energy standards. To make government accountable, he would review every agency for waste and fraud, regulate paid and out-of-state petition circulators, revive a Border Strike Force against human and drug trafficking, fully resource state troopers and school security, and encourage participation in the federal 287(g) program. On natural resources, he would develop a long-term water strategy, defend Arizona's Colorado River allocation, manage forests against wildfire, and repeal the executive order prioritizing wind and solar on state land. On education, he would opt into the federal education tax credit, protect Empowerment Scholarship Accounts, and prioritize reading, writing, and math. On health, he would end medical mandates, make ivermectin available over the counter, and create a "Make Arizona Healthy Again" council. He would sign election integrity bills Hobbs vetoed.
