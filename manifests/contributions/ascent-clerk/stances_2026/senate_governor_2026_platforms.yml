    summary: Acton, a physician and former Ohio health director, presents an "ActOn Costs Agenda" to lower costs, cut taxes for working families, and put money back in Ohioans' pockets. On health care, she would protect Medicaid and Medicare from cuts by cutting red tape, shortening approval waits, and eliminating waste and fraud; launch "Ohio Rx," an online platform using the state's Medicaid single pharmacy benefit manager purchasing power to lower drug prices for all Ohioans; forgive medical debt starting on her first day by joining Ohio cities' debt-relief efforts; bring more transparency to insurance premiums; and crack down on surprise billing and aggressive collections. On energy, she would appoint utility commissioners who put ratepayers first, restore the Office of the Consumers' Counsel budget, pursue an all-of-the-above strategy using the lowest-cost and cleanest available sources, expand and protect assistance programs such as HEAP, PIPP, and weatherization, reinstate energy efficiency, demand response, and renewable portfolio standards gutted under HB6, help consumers control usage, and work with other PJM states to reform the regional grid. She pledges to eliminate hidden fees, crack down on wage theft, and protect consumers, seniors, veterans, military families, and students from scams, predatory lending, and fraud. She says years of cuts have left public safety understaffed and pledges to fully fund police and first responders and rebuild state-local partnerships. She also pledges to crack down on corruption and dark money, requiring transparency in contracting and regulatory decisions.
