  code: COMMUNICATION-WEB-BYRONDONALDS_COM-2026_10_31-ISSUES
  attributes:
    kind: platform
    title: Byron Donalds 2026 governor campaign platform (Florida)
    published_on: '2025-06-17'
    url: https://byrondonalds.com/issues/
    availability: available
    summary: Donalds frames his agenda as an "Accountable, Achievable, Affordable" Florida. On insurance, he would protect tort reforms, refocus My Safe Florida Home grants on storm-hardening, keep Citizens Insurance small, and create an online scorecard comparing insurers on price, claim speed, and denials; he would also keep data centers from passing electricity and water costs to households. His "Your Doctor, Your Price" plan would require posted guaranteed cash prices for the 50 most common procedures, give cash patients the lowest negotiated rate, require insurers to approve common treatments within three days, and expose pharmacy middleman markups. He proposes a permitting "shot clock" website, specialized business courts, and keeping Florida free of a personal income tax. On education, he would train teachers in phonics, screen K-2 students for reading problems, provide free tutoring for struggling third graders, create "LaunchPad Florida" paid apprenticeships, and let education money follow the student. He would seek to move NASA headquarters to the Space Coast, require E-Verify for all businesses, and offer police hiring bonuses. His "Healthy Florida" plan would remove ultra-processed foods and dyes from school meals, and he would finish Everglades reservoir projects and reduce runoff.
    language: en
