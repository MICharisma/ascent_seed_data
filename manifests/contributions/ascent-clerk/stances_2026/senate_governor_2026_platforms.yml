  code: COMMUNICATION-WEB-ACTONFORGOVERNOR_COM-2026_10_31-ISSUES
  attributes:
    kind: platform
    title: Amy Acton 2026 governor campaign platform (Ohio)
    published_on: '2026-04-07'
    url: https://actonforgovernor.com/agenda/
    availability: available
    summary: Acton, a physician and former Ohio health director, presents an "ActOn Costs Agenda" to lower costs and cut taxes for working families. On health care, she would protect Medicaid and Medicare by cutting red tape, waits, waste, and fraud; launch "Ohio Rx," an online platform using the state's Medicaid pharmacy purchasing power to lower drug prices; forgive medical debt starting on her first day; bring transparency to insurance premiums; and crack down on surprise billing and aggressive collections. On energy, she would appoint ratepayer-first utility commissioners, restore the Consumers' Counsel budget, pursue an all-of-the-above strategy using the lowest-cost and cleanest sources, protect assistance programs such as HEAP, PIPP, and weatherization, reinstate the energy efficiency, demand response, and renewable portfolio standards gutted under HB6, and work with other PJM states on grid reform. She pledges to eliminate hidden fees, crack down on wage theft, protect consumers from scams and predatory lending, fully fund police and first responders, and require transparency in contracting to fight corruption and dark money.
    language: en
    featured_candidacies:
    - CANDIDACY-USA-OH-GOVERNOR-2026_GENERAL-ACTON_AM_7H
