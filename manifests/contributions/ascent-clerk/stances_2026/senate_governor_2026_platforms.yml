    summary: Governor Abbott's policy agenda, "Stronger Texas. Brighter Tomorrow.", promises more savings, opportunity, and freedom. On property taxes, he would let voters decide whether to abolish school district property taxes, with the state funding schools, which he says would halve the average homestead's taxes; appraise property only once every five years; extend the 10 percent annual appraisal cap to all properties; allow a rollback election when 15 percent of local voters petition; limit local spending growth to the lesser of population plus inflation or 3.5 percent; apply debt limits and deficit bans to local governments; and require two-thirds voter approval for local property tax increases. On housing, he would cut red tape and allow property additions to be built by right. On health care, he would cap co-pays at $25 and lower premiums by reducing costly insurance mandates. He would let insurers consider traffic violations so good drivers save on auto insurance, and lower home insurance costs. On energy, he would open city utility monopolies to retail electric competition. On public safety, he would expand DPS operations targeting repeat offenders, deny bail to illegal immigrants arrested for violent felonies, and allow impeachment of district attorneys who fail to uphold their oath. On higher education, he proposes $500 off summer tuition and fees and required accelerated 90-credit-hour degrees in high-demand fields. On public education, he aims to make Texas first in reading and math through reading and math academies and targeted support, and to direct funding to classrooms and teachers rather than administrative bureaucracy.
    language: en
    featured_candidacies:
    - CANDIDACY-USA-TX-GOVERNOR-2026_GENERAL-ABBOTT_GR_9G
  references:
    channel: CHANNEL-WEB-GREGABBOTT_COM
