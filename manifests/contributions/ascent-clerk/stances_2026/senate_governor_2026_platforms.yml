    summary: Donalds frames his agenda as an "Accountable, Achievable, Affordable" Florida. On insurance and affordability, he would protect tort reforms against lawsuit abuse, trim state fees when reserves are full, pursue regulatory reforms to lower premiums, refocus My Safe Florida Home grants on storm-hardening upgrades that cut premiums most, keep Citizens Insurance small to avoid post-storm assessments, speed rebuilding permits, create an online scorecard comparing insurers on price, claim speed, and denials with industry-funded reporting and fines, keep property taxes in check, and stop large data centers from passing electricity and water costs to households. His "Your Doctor, Your Price" health plan would require posted guaranteed cash prices for the 50 most common procedures, give cash patients the lowest negotiated rate, count out-of-network payments toward deductibles, require insurers to approve common treatments within three days, and expose pharmacy middleman markups. On the economy, he proposes a public "shot clock" website for permits, a single digital permitting hub, specialized business courts, and keeping Florida free of a personal income tax with balanced budgets and tax cuts. On education, he would train teachers in phonics, screen for reading problems in K–2, provide free tutoring for struggling third graders, reward top reading teachers, and limit screens; create "LaunchPad Florida" paid apprenticeships in construction, manufacturing, and defense; give every student a personalized success plan by sixth grade with family involvement; restore the Presidential Fitness Test and fund daily recess; let education money follow the student; and keep partisan theories out of classrooms. He would seek to move NASA headquarters and the Space Force Academy to the Space Coast, pre-approve space manufacturing sites, and train aerospace workers. On infrastructure, he would speed road and bridge work without new tolls and require utilities to harden lines and water plants against major hurricanes. On law and order, he would end state benefits that encourage illegal immigration, require E-Verify for all businesses, coordinate with federal authorities to deport noncitizens who commit crimes, target cartels and fentanyl, offer police hiring bonuses, protect officers from frivolous complaints, and enforce firm sentences for violent offenders. His "Healthy Florida" plan would remove ultra-processed foods and dyes from school meals, post menus and ingredients, connect local farms to schools, and test school water for lead, forever chemicals, and microplastics. On the environment, he would finish Everglades reservoir and canal projects, fix leaking sewer lines, and reduce runoff.
    language: en
    featured_candidacies:
    - CANDIDACY-USA-FL-GOVERNOR-2026_GENERAL-DONALDS_BY_2B
  references:
    channel: CHANNEL-WEB-BYRONDONALDS_COM
