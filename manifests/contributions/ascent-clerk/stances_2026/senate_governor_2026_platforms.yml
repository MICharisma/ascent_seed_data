  code: COMMUNICATION-WEB-JOCELYNBENSON_COM-2026_10_31-ISSUES
  attributes:
    kind: platform
    title: Jocelyn Benson 2026 governor campaign platform (Michigan)
    published_on: '2026-10-30'
    url: https://www.jocelynbenson.com/issues
    availability: available
    summary: Benson's "Affordable Michigan" agenda centers on costs hitting families hardest. On housing, she would streamline regulations that slow construction, incentivize starter homes and affordable units, and crack down on corporate investors and out-of-state speculators. Calling health care a right, she criticizes federal Medicaid cuts and would expand low- or no-cost preventive care, create an independent Prescription Drug Affordability Board with authority over price increases, pass cost transparency legislation to end surprise billing, expand medical debt relief, and pass a $5,000 caregiver tax credit. On child care, she proposes bringing Rx Kids statewide and removing barriers for qualified providers. She says utilities seek rate increases without delivering reliability and calls for reforming the system. On education, she describes a data-driven plan to build a world-class public school system. She would impose a moratorium on data centers until enforceable rules exist, including public hearings, disclosure, no tax breaks, protections for water and land, data centers rather than consumers bearing added energy costs, and union contracts. She says protecting the Great Lakes, public health, good jobs, and lower costs are the same fight, and champions clean, renewable energy.
    language: en
