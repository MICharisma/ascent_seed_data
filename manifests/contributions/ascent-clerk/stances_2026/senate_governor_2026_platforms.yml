    summary: Crowley, the Milwaukee County executive, says his campaign aims to improve life for working Wisconsinites in every zip code. He would grow an economy rooted in local ownership and union labor, take his Building Bridges storefront and commercial corridor program statewide, and modernize apprenticeships and technical training in the trades, health care, and green energy. He would make Wisconsin the Midwest's best place to start a small business by streamlining permitting, backing community lenders, and prioritizing storefront growth over corporate subsidies, with clear expectations attached to public investments. On health care, he would expand mobile outreach, addiction treatment, and EMS innovation. He would build and preserve energy-efficient affordable housing in rural, urban, and suburban areas and cut barriers to construction. On education, he supports universal early childhood education, new public school investment, and closing the special education reimbursement gap. He calls climate action economic investment, proposing solar, energy retrofits, and clean infrastructure that create union jobs. He would close the broadband gap, repair roads, expand transit, and use revenue reform to give local governments funding tools while lowering property taxes and restoring local control. He would protect voting rights and push for nonpartisan redistricting. On child care, he proposes paid family leave, direct provider support such as Child Care Counts, and a 7 percent cap on families' out-of-pocket child care costs. He also supports investments in home- and community-based services for people with disabilities.
