    summary: 'Bottoms''s issues page covers health care, housing, education, agriculture, small business, public safety, rights and democracy, the environment, veterans, and grocery costs. On health care, she would expand Medicaid and replace the Georgia Pathways program with fuller coverage, stabilize rural hospitals through a Rural Care First Initiative expanding EMS, mobile health, telehealth, and labor and delivery access, create a Georgia Rx Savings Board on drug costs, strengthen mental health care, invest in maternal and public health, and protect reproductive freedom. On housing, she proposes a Georgia Housing Fast Track to streamline permitting, expanded down-payment and renter assistance, and an affordable housing trust fund. On education, she would fully fund schools and modernize the funding formula, emphasize literacy and early learning, expand financial literacy, pursue universal child care, eliminate state income tax for teachers, and create a path to free technical and community college. For farmers, she supports keeping land in family hands, training in sustainable agriculture and forestry, cooperatives, fairer access to federal farm programs for underserved producers, and help for farmers hurt by tariffs. For small business, she would restructure the Department of Economic Development with an Office of Small Business focused on firms of up to 25 employees and expand small business loans and grants. On public safety, she pairs enforcement and prevention: expanded GBI and forensic support for local agencies, targeted violence reduction, universal background checks and a red flag law, diversion and treatment for nonviolent cases, and a Prison to Work reentry initiative. On rights and democracy, she would fight to restore a woman''s right to choose, oppose laws making voting harder, protect local election officials, rein in the State Election Board, expand early and absentee voting, and make Election Day a state holiday. On the environment, she supports flood mitigation, brownfield redevelopment, reliable water infrastructure, and slowing and reassessing data center expansion. For veterans, she would count military experience toward civilian licenses, speed veteran hiring, offer tax relief for veterans and military retirees, and support military families. She would also let cities and counties eliminate or suspend local sales taxes on groceries and essentials such as diapers and formula when prices spike.'
    language: en
    featured_candidacies:
    - CANDIDACY-USA-GA-GOVERNOR-2026_GENERAL-BOTTOMS_KS_6Y
  references:
    channel: CHANNEL-WEB-KEISHAFORGOVERNOR_COM
