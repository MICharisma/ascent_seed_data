  code: COMMUNICATION-WEB-DRANNIEANDREWS_COM-2026_10_31-ISSUES
  attributes:
    kind: platform
    title: Annie Andrews 2026 U.S. Senate campaign platform (South Carolina)
    published_on: '2026-10-31'
    url: https://drannieandrews.com/issues/
    availability: available
    summary: Andrews, a pediatrician and mother, organizes her platform around six issues. On the economy, she pledges to end tax breaks for the ultra-wealthy and corporate polluters, raise wages and strengthen workers' rights, expand affordable child care and paid family leave, and restore trade policies that protect South Carolina jobs and farms. Drawing on caring for children who survived shootings, she says the Second Amendment can be respected while protecting children, and supports banning "weapons of war," safe storage laws, and funding for violence prevention and mental health programs. She takes no corporate PAC money and supports banning corporate PAC and dark money, barring members of Congress from trading stocks, term limits, and stronger ethics rules. Calling health care a right, she supports a public option, affordable mental health care, protecting Medicaid and Medicare, lower drug prices, and restored research funding. She pledges to restore the protections of Roe v. Wade and expand rural maternal health services. On schools, she would fully fund public schools and special education, expand early learning, raise teacher pay, and protect free and reduced-price meals.
    language: en
