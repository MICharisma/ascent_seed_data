  code: COMMUNICATION-WEB-SCOTTCOLOM_COM-2026_10_31-ISSUES
  attributes:
    kind: platform
    title: Scott Colom 2026 U.S. Senate campaign platform (Mississippi)
    published_on: '2026-10-07'
    url: https://scottcolom.com/priorities/
    availability: available
    summary: Colom, a district attorney and seventh-generation Mississippian, says Mississippians deserve a senator who works for them. He would vote to return tariff power to Congress, require a congressional vote before war, and seek an Agriculture Committee seat. He supports raising the minimum wage and tying it to the cost of living, and working to end federal income tax for Mississippians earning under $75,000, starting with teachers and law enforcement. On health care, he would vote to cancel Medicaid cuts to keep rural emergency and delivery rooms open, restore ACA premium tax credits, and restore federal funding to encourage Medicaid expansion. He supports pausing new data center construction until companies pay for their own power and water, disclose deals, and commit in writing to hire Mississippi workers, and he wants a real person to answer when AI makes decisions about people's lives. On ethics, he backs a stock-trading ban for members and families, a ban on money from companies under federal investigation, an empowered Senate ethics office, and overturning Citizens United. Citing ten years as a prosecutor, he pledges to back law enforcement and enforce immigration law.
