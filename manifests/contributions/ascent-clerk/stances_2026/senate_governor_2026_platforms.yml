    summary: El-Sayed, a physician and former Detroit and Wayne County public health official, says his campaign takes no corporate money and centers on getting money out of politics, putting money in people's pockets, and passing Medicare for All. On democracy, he supports overturning Citizens United, banning outside spending through corporate 501(c)(4)s, super PACs, and 527 groups, drawing congressional districts by a federal nonpartisan expert committee, Supreme Court reform, abolishing the filibuster, opposing mandatory voter ID laws such as the SAVE Act, and automatic voter registration at 18. On civil rights, he pledges to protect Americans regardless of origin, religion, sexual orientation, gender identity, age, or wealth, keep health decisions between patients and doctors with private health data, protect speech and peaceful protest, and replace current immigration policy with a comprehensive system. On the environment, he would hold corporate polluters accountable, codify the Endangerment Finding, protect the Great Lakes, act on climate change, and create a federal guarantee of clean, affordable water, citing Flint, Detroit shutoffs, and PFAS. On foreign policy, he supports Ukraine against Russia's invasion, opposes the war in Iran and favors diplomacy to prevent a nuclear-armed Iran, rejects a path toward war with China while maintaining strategic ambiguity on Taiwan, opposes blank-check military aid to foreign governments including Israel, Egypt, and Saudi Arabia, calls for ending what he describes as U.S.-backed genocide in Gaza and enforcing arms-transfer laws, and supports engagement with the WHO and the Paris Agreement. On the economy, he opposes corporate tax breaks and NAFTA-style trade deals, supports investment in domestic manufacturing and research agencies like the NSF and NIH, a strong FTC enforcing anti-monopoly law, curbs on Wall Street speculation, and taxing billionaire wealth and closing loopholes. On AI, he supports public oversight, exploring wage insurance and basic income, tax changes that stop rewarding automation over human work, safety testing and "rules of the road," stronger rules on crypto abuse, and federal zoning guidelines for data centers. On housing, he calls for a building boom through major public investment and streamlined regulation. On education, he proposes matching education funding increases to defense budget increases, universal child care and pre-K, fully funding IDEA, expanded vocational and apprenticeship programs, and more research funding for universities. He also calls for redirecting farm support from large corn and soy operations to family farmers.
