  code: COMMUNICATION-WEB-KEISHAFORGOVERNOR_COM-2026_10_31-ISSUES
  attributes:
    kind: platform
    title: Keisha Bottoms 2026 governor campaign platform (Georgia)
    published_on: '2026-10-31'
    url: https://www.keishaforgovernor.com/issues
    availability: available
    summary: Bottoms's issues page covers health care, housing, education, agriculture, small business, public safety, democracy, the environment, veterans, and grocery costs. She would expand Medicaid in place of the Georgia Pathways program, stabilize rural hospitals through a Rural Care First Initiative expanding EMS, telehealth, and labor and delivery access, create a Georgia Rx Savings Board, and protect reproductive freedom. She proposes a Georgia Housing Fast Track to streamline permitting, down-payment and renter assistance, and an affordable housing trust fund. She would modernize school funding, emphasize literacy and early learning, pursue universal child care, eliminate state income tax for teachers, and create a path to free technical and community college. She would create an Office of Small Business for firms of up to 25 employees. On public safety, she pairs expanded GBI support and violence reduction with universal background checks, a red flag law, diversion for nonviolent cases, and a Prison to Work reentry initiative. She would expand early and absentee voting and make Election Day a state holiday, slow and reassess data center expansion, offer tax relief for veterans, and let localities suspend sales taxes on groceries and essentials when prices spike.
