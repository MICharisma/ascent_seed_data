    summary: Biggs's issues platform has six themes. To make Arizona affordable, he would eliminate the state income tax and work with localities to reduce property taxes, lower home construction costs by streamlining state bureaucracy and permitting and ending what he calls Governor Hobbs's anti-homebuilding policies, pursue reliable energy including nuclear, reduce fuel dependence on California, stop Wall Street from buying up homes, attract business through a favorable tax structure and workforce development, repeal burdensome regulations, and end state incentives for data centers while setting standards to protect water and energy. To make government accountable, he would review every agency for waste, fraud, and abuse, regulate paid and out-of-state petition circulators, disclose federal funds received by the state, equip law enforcement against drug trafficking, revive a Border Strike Force focused on human and drug trafficking, improve recruitment and retention of police and corrections officers, fully resource state troopers, fully fund school security, and encourage participation in the federal 287(g) program. On natural resources, he would develop a long-term water strategy, defend Arizona's Colorado River allocation, measure aquifers accurately, manage forests against wildfire with federal partners, promote responsible mining, encourage nuclear development, and repeal the executive order prioritizing wind and solar on state land. On education, he would opt into the federal education tax credit, protect Empowerment Scholarship Accounts, increase funding using state trust assets, prioritize reading, writing, and math over DEI or CRT, and promote trades and coordination between schools and employers. On health, he would end medical mandates, require schools to inform parents about vaccine exemptions, bar public colleges from requiring vaccines, make ivermectin available over the counter, limit soda and junk food purchases with SNAP, allow restaurants to sell state-licensed raw milk, promote organic farming and nutrition education, ban exposure to gain-of-function research, and create a "Make Arizona Healthy Again" advisory council. On elections, he would sign election integrity legislation vetoed by Governor Hobbs, speed results, and ensure only eligible citizens vote.
    language: en
    featured_candidacies:
    - CANDIDACY-USA-AZ-GOVERNOR-2026_GENERAL-BIGGS_AN_6Q
  references:
    channel: CHANNEL-WEB-BIGGSFORARIZONA_COM
