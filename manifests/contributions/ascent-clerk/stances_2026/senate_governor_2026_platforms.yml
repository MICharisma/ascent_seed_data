    summary: Drazan's "Drazan Plan" says Oregon cannot keep doing the same thing and expect different results, and sets out to make Oregon the best place to raise a family, start a business, buy a home, learn a trade, and get a world-class education. On cost of living, she would issue a Day One Affordability Executive Order directing agencies to identify costly rules and fees, suspend discretionary rules exceeding state or federal requirements, require affordability reviews of major new rules, repeal the Climate Protection Program executive order, veto new tax and fee increases, reform the Corporate Activity Tax and the estate tax, raise the standard deduction, cut property taxes for veterans, disabled veterans, and seniors over 65, offer free state park day use for Oregon-plated vehicles and restore the Disabled Veteran Camping Benefit, repeal policies that raise food costs, and protect the kicker. On the economy, she would declare Oregon "open for business," freeze new regulations, create correction periods for minor violations and a Small Business Bill of Rights, establish a recurring $200 million site-readiness and infrastructure fund, prioritize reliable, lowest-cost, technology-neutral energy, increase sustainable timber production, prioritize traded-sector industries, and expand apprenticeships and career and technical education. On homelessness and addiction, she would audit homeless and addiction spending, prioritize recovery and treatment, reconnect people with family, fully fund state police and let localities clean up public spaces, raise penalties for drug traffickers, end funding for programs she says enable addiction, and declare a state of emergency on addiction and mental health. On housing, she proposes a 120-day maximum decision period for qualifying projects, limits on repetitive appeals, private plan reviewers, first-time buyer tax credits and down-payment help, easier commercial-to-residential conversion, a Housing Permit Command Center, more buildable land while protecting farmland, pre-approved plans and standardized ADU, modular, manufactured, and tiny-home rules, and construction-defect litigation reform. On education, she would restore graduation requirements, require third-grade reading proficiency before promotion, opt into the federal scholarship tax credit, let teachers remove persistently disruptive students, strengthen special education, cut administrative red tape, move to a school-day-based system, support school choice, and ensure curriculum transparency and parental opt-outs. On government, she would create an Office of Government Accountability, publish an annual Cost of Government Report and an economic scorecard, reform boards and commissions, rescind costly executive orders, veto wasteful projects, and strengthen the Public Records Advocate. On data centers, she would end special treatment, protect communities from unwanted development, require community benefit agreements, ban blanket nondisclosure agreements, protect farmland, and complete a long-term energy plan.
    language: en
