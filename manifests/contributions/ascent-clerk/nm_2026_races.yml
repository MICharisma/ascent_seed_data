  attributes:
    status: upcoming
    description: 'Vote for: 1. Governor, Nov 3, 2026. Candidates per the New Mexico Secretary of State 2026 General Election Contest/Candidate List (https://candidateportal.servis.sos.state.nm.us/CandidateList.aspx), status ''Qualified''. In New Mexico the Governor and Lieutenant Governor are nominated separately in the primary and elected jointly on one general-election ticket (N.M. Const. art. V sec. 1); the SoS general list prints each ticket as one line (''Governor and Lieutenant Governor''). The repo cannot model a ticket, so the general candidacies are separate Governor and Lieutenant Governor races paired by party.'
