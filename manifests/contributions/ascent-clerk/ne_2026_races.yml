- type: Race
  code: RACE-USA-NE-GOVERNOR-2026_GENERAL
  attributes:
    status: upcoming
    description: 'Vote for: 1 ticket. Governor and Lt. Governor, Nov 3, 2026. Candidates per the Nebraska Secretary of State Final Statewide General Candidate List, 9/11/2026 (https://sos.nebraska.gov/sites/default/files/doc/elections/2026/Final_Statewide_General_Candidate_Filing_List_9.11.26.pdf). In Nebraska the Governor is nominated alone in the primary and the nominee then names a Lieutenant Governor running mate (Neb. Rev. Stat. 32-617); the general ballot prints one joint ticket (''Governor and Lt. Governor''). The repo cannot model a ticket, so the general candidacies are separate Governor and Lieutenant Governor races paired by party.'
  references:
    election: ELECTION-USA-NE-2026_GENERAL
    office: OFFICE-USA-NE-GOVERNOR
