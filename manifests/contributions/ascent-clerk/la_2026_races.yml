  attributes:
    status: completed
    description: 'Democratic primary for U.S. Senate, May 16, 2026 (closed party primary; second party primary June 27). Candidates per the Louisiana Secretary of State 2026 primary candidate list (https://voterportal.sos.la.gov/CandidateInquiry?electionDate=20260516), which lists every candidate on that primary ballot. Louisiana closed party primary (Act 1 of 2024): May 16, 2026, majority required; if no majority, a second party primary on June 27, 2026 (folded into this race) between the top two. Unaffiliated voters may choose one party''s ballot. Candidate lists: https://voterportal.sos.la.gov/CandidateInquiry?electionDate=20260516 and https://voterportal.sos.la.gov/CandidateInquiry?electionDate=20260627.'
