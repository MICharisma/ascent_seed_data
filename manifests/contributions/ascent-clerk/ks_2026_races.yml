  code: RACE-USA-KS-GOVERNOR-2026_GENERAL
  attributes:
    status: upcoming
    description: 'Vote for: 1 ticket. Governor, Nov 3, 2026. Candidates per the Kansas Secretary of State 2026 General Election candidate list (https://sos.ks.gov/elections/elections_upcoming_candidate.aspx, election ''2026 General''). Kansas elects the Governor and Lieutenant Governor jointly as one ticket in both the primary and the general (K.S.A. 25-213); the SoS lists print ''Governor / Lt. Governor'' with both names. The repo cannot model a ticket, so the candidacies are split into Governor and Lieutenant Governor races paired by party, with the running mate noted.'
