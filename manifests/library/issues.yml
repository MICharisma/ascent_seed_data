# The issue library: broad topics, the problems within them, and approaches proposed in response.
# Approaches describe policy options without reference to any candidate; a candidacy's position on one is a Stance.
# Codes: TOPIC-{topic}, ISSUE-{topic}-{issue}, APPROACH-{topic}-{issue}-{approach}, each built from the titles.
# Contributions add records here or in sibling files; an issued code never changes, and a better title keeps its code.
format: micharisma-seeds/v1
namespace: MIC
catalog: ASC
records:
- type: Topic
  code: TOPIC-EDUCATION
  attributes:
    title: Education
    description: Educational systems, policies, and programs that ensure quality learning opportunities, equitable access, and academic achievement for students at all levels from early childhood through higher education.
- type: Issue
  code: ISSUE-EDUCATION-SCHOOL_FUNDING_SHORTFALLS
  attributes:
    title: School Funding Shortfalls
    description: Inadequate per-pupil funding is resulting in larger class sizes, outdated textbooks, deferred maintenance, elimination of music and arts programs, and difficulty recruiting and retaining qualified teachers, particularly in high-need districts.
  references:
    topic: TOPIC-EDUCATION
- type: Approach
  code: APPROACH-EDUCATION-SCHOOL_FUNDING_SHORTFALLS-EDUCATION_REVENUE_BOND_INITIATIVE
  attributes:
    title: Education Revenue Bond Initiative
    description: Issue municipal bonds dedicated to education funding, allowing voters to approve additional property tax revenue specifically for schools, with transparent oversight and regular reporting on fund usage and educational outcomes.
  references:
    issue: ISSUE-EDUCATION-SCHOOL_FUNDING_SHORTFALLS
- type: Approach
  code: APPROACH-EDUCATION-SCHOOL_FUNDING_SHORTFALLS-STATE_FUNDING_FORMULA_REFORM
  attributes:
    title: State Funding Formula Reform
    description: Advocate for state-level changes to per-pupil funding formulas that account for local cost of living, special needs populations, and equity adjustments, while lobbying for increased overall state education investment.
  references:
    issue: ISSUE-EDUCATION-SCHOOL_FUNDING_SHORTFALLS
- type: Approach
  code: APPROACH-EDUCATION-SCHOOL_FUNDING_SHORTFALLS-CORPORATE_EDUCATION_PARTNERSHIP_PROGRAM
  attributes:
    title: Corporate Education Partnership Program
    description: Establish formal partnerships with local businesses to provide direct funding, equipment donations, internship programs, and professional mentoring, creating sustainable private sector investment in public education.
  references:
    issue: ISSUE-EDUCATION-SCHOOL_FUNDING_SHORTFALLS
- type: Issue
  code: ISSUE-EDUCATION-STUDENT_ACHIEVEMENT_GAPS
  attributes:
    title: Student Achievement Gaps
    description: Persistent disparities in academic performance between different demographic groups, with students from low-income families and certain racial/ethnic backgrounds consistently scoring lower on standardized tests and graduating at lower rates.
  references:
    topic: TOPIC-EDUCATION
- type: Approach
  code: APPROACH-EDUCATION-STUDENT_ACHIEVEMENT_GAPS-COMPREHENSIVE_EARLY_CHILDHOOD_INITIATIVE
  attributes:
    title: Comprehensive Early Childhood Initiative
    description: Implement universal pre-K programs, expand head start enrollment, provide family literacy support, and create seamless transitions from early childhood programs to elementary school to address achievement gaps before they widen.
  references:
    issue: ISSUE-EDUCATION-STUDENT_ACHIEVEMENT_GAPS
- type: Approach
  code: APPROACH-EDUCATION-STUDENT_ACHIEVEMENT_GAPS-TARGETED_ACADEMIC_SUPPORT_PROGRAM
  attributes:
    title: Targeted Academic Support Program
    description: Deploy additional tutoring, extended learning time, summer programs, and individualized support specifically for underperforming student populations, with data-driven tracking and culturally responsive teaching methods.
  references:
    issue: ISSUE-EDUCATION-STUDENT_ACHIEVEMENT_GAPS
- type: Approach
  code: APPROACH-EDUCATION-STUDENT_ACHIEVEMENT_GAPS-COMMUNITY_SCHOOLS_MODEL
  attributes:
    title: Community Schools Model
    description: Transform schools into community hubs offering wraparound services including healthcare, social services, adult education, and family support to address socioeconomic barriers to student achievement.
  references:
    issue: ISSUE-EDUCATION-STUDENT_ACHIEVEMENT_GAPS
- type: Issue
  code: ISSUE-EDUCATION-TEACHER_SHORTAGE_CRISIS
  attributes:
    title: Teacher Shortage Crisis
    description: Critical shortage of qualified teachers, especially in math, science, special education, and bilingual education, leading to increased use of substitute teachers, larger class sizes, and some classes being cancelled or combined.
  references:
    topic: TOPIC-EDUCATION
- type: Approach
  code: APPROACH-EDUCATION-TEACHER_SHORTAGE_CRISIS-TEACHER_RECRUITMENT_AND_RETENTION_INITIATIVE
  attributes:
    title: Teacher Recruitment and Retention Initiative
    description: Increase teacher salaries to competitive regional levels, provide signing bonuses for high-need subjects, offer loan forgiveness programs, and create affordable housing assistance for educators to attract and retain quality teachers.
  references:
    issue: ISSUE-EDUCATION-TEACHER_SHORTAGE_CRISIS
- type: Approach
  code: APPROACH-EDUCATION-TEACHER_SHORTAGE_CRISIS-ALTERNATIVE_CERTIFICATION_PATHWAYS
  attributes:
    title: Alternative Certification Pathways
    description: Develop fast-track certification programs for career professionals, expanded master's degree programs with teaching components, and partnerships with universities to create innovative teacher preparation routes.
  references:
    issue: ISSUE-EDUCATION-TEACHER_SHORTAGE_CRISIS
- type: Approach
  code: APPROACH-EDUCATION-TEACHER_SHORTAGE_CRISIS-COMPREHENSIVE_TEACHER_SUPPORT_SYSTEM
  attributes:
    title: Comprehensive Teacher Support System
    description: Implement robust mentoring programs, reduce non-teaching administrative burdens, provide professional development stipends, and create collaborative planning time to improve working conditions and job satisfaction.
  references:
    issue: ISSUE-EDUCATION-TEACHER_SHORTAGE_CRISIS
- type: Issue
  code: ISSUE-EDUCATION-SCHOOL_INFRASTRUCTURE_DECAY
  attributes:
    title: School Infrastructure Decay
    description: Aging school buildings with failing HVAC systems, leaking roofs, outdated technology infrastructure, and accessibility issues that create unsafe learning environments and barriers to modern educational methods.
  references:
    topic: TOPIC-EDUCATION
- type: Approach
  code: APPROACH-EDUCATION-SCHOOL_INFRASTRUCTURE_DECAY-SYSTEMATIC_INFRASTRUCTURE_ASSESSMENT_AND_REPAIR
  attributes:
    title: Systematic Infrastructure Assessment and Repair
    description: Conduct comprehensive facility audits, prioritize safety and health-critical repairs, establish dedicated maintenance funding streams, and implement preventive maintenance schedules to address deferred maintenance systematically.
  references:
    issue: ISSUE-EDUCATION-SCHOOL_INFRASTRUCTURE_DECAY
- type: Approach
  code: APPROACH-EDUCATION-SCHOOL_INFRASTRUCTURE_DECAY-21ST_CENTURY_LEARNING_ENVIRONMENTS_INITIATIVE
  attributes:
    title: 21st Century Learning Environments Initiative
    description: Modernize classrooms with updated technology infrastructure, flexible learning spaces, improved acoustics and lighting, and energy-efficient systems that support contemporary teaching methods and reduce operational costs.
  references:
    issue: ISSUE-EDUCATION-SCHOOL_INFRASTRUCTURE_DECAY
- type: Approach
  code: APPROACH-EDUCATION-SCHOOL_INFRASTRUCTURE_DECAY-SCHOOL_CONSTRUCTION_PUBLIC_PRIVATE_PARTNERSHIP
  attributes:
    title: School Construction Public-Private Partnership
    description: Partner with private developers to build new schools or renovate existing ones through long-term lease agreements, allowing immediate improvements while spreading costs over time through performance-based contracts.
  references:
    issue: ISSUE-EDUCATION-SCHOOL_INFRASTRUCTURE_DECAY
- type: Topic
  code: TOPIC-HEALTHCARE
  attributes:
    title: Healthcare
    description: Public health initiatives, healthcare access, medical services delivery, health insurance policies, disease prevention, and health emergency preparedness that promote community wellness and medical equity.
- type: Issue
  code: ISSUE-HEALTHCARE-RURAL_HEALTHCARE_ACCESS
  attributes:
    title: Rural Healthcare Access
    description: Limited access to healthcare services in rural areas due to hospital closures, physician shortages, and inadequate transportation, forcing residents to travel long distances for basic medical care and emergency services.
  references:
    topic: TOPIC-HEALTHCARE
- type: Approach
  code: APPROACH-HEALTHCARE-RURAL_HEALTHCARE_ACCESS-MOBILE_HEALTH_CLINIC_NETWORK
  attributes:
    title: Mobile Health Clinic Network
    description: Deploy mobile health units staffed with nurse practitioners and physicians to provide regular primary care, preventive services, and specialist consultations to rural communities, with telemedicine capabilities for remote diagnosis.
  references:
    issue: ISSUE-HEALTHCARE-RURAL_HEALTHCARE_ACCESS
- type: Approach
  code: APPROACH-HEALTHCARE-RURAL_HEALTHCARE_ACCESS-RURAL_HEALTHCARE_PROVIDER_INCENTIVE_PROGRAM
  attributes:
    title: Rural Healthcare Provider Incentive Program
    description: Offer medical school loan forgiveness, housing assistance, competitive salaries, and professional development opportunities to attract physicians, nurses, and specialists to practice in underserved rural areas.
  references:
    issue: ISSUE-HEALTHCARE-RURAL_HEALTHCARE_ACCESS
- type: Approach
  code: APPROACH-HEALTHCARE-RURAL_HEALTHCARE_ACCESS-REGIONAL_HEALTHCARE_COLLABORATION_HUB
  attributes:
    title: Regional Healthcare Collaboration Hub
    description: Create partnerships between rural hospitals, urban medical centers, and specialty clinics to share resources, provide telemedicine consultations, and coordinate patient transfers for specialized care.
  references:
    issue: ISSUE-HEALTHCARE-RURAL_HEALTHCARE_ACCESS
- type: Issue
  code: ISSUE-HEALTHCARE-MENTAL_HEALTH_SERVICE_GAPS
  attributes:
    title: Mental Health Service Gaps
    description: Insufficient mental health services and long waiting lists for counseling and psychiatric care, particularly for children, adolescents, and low-income residents, contributing to untreated mental illness and community health crises.
  references:
    topic: TOPIC-HEALTHCARE
- type: Approach
  code: APPROACH-HEALTHCARE-MENTAL_HEALTH_SERVICE_GAPS-INTEGRATED_COMMUNITY_MENTAL_HEALTH_SYSTEM
  attributes:
    title: Integrated Community Mental Health System
    description: Establish community mental health centers offering comprehensive services from crisis intervention to long-term therapy, with sliding fee scales, peer support programs, and coordination with primary healthcare providers.
  references:
    issue: ISSUE-HEALTHCARE-MENTAL_HEALTH_SERVICE_GAPS
- type: Approach
  code: APPROACH-HEALTHCARE-MENTAL_HEALTH_SERVICE_GAPS-SCHOOL_BASED_MENTAL_HEALTH_SERVICES
  attributes:
    title: School-Based Mental Health Services
    description: Place licensed mental health counselors in schools to provide immediate access to services for students, offer family counseling, implement mental health education curricula, and train teachers in trauma-informed practices.
  references:
    issue: ISSUE-HEALTHCARE-MENTAL_HEALTH_SERVICE_GAPS
- type: Approach
  code: APPROACH-HEALTHCARE-MENTAL_HEALTH_SERVICE_GAPS-TELEHEALTH_MENTAL_HEALTH_EXPANSION
  attributes:
    title: Telehealth Mental Health Expansion
    description: Expand access to mental health services through teletherapy platforms, online counseling programs, and virtual support groups, particularly targeting underserved populations and reducing geographic barriers to care.
  references:
    issue: ISSUE-HEALTHCARE-MENTAL_HEALTH_SERVICE_GAPS
- type: Issue
  code: ISSUE-HEALTHCARE-HEALTHCARE_AFFORDABILITY_CRISIS
  attributes:
    title: Healthcare Affordability Crisis
    description: Rising healthcare costs and insurance premiums are making medical care unaffordable for middle-class families, leading to delayed treatment, medical debt, and people foregoing necessary medications and procedures.
  references:
    topic: TOPIC-HEALTHCARE
- type: Approach
  code: APPROACH-HEALTHCARE-HEALTHCARE_AFFORDABILITY_CRISIS-MUNICIPAL_HEALTHCARE_PURCHASING_COOPERATIVE
  attributes:
    title: Municipal Healthcare Purchasing Cooperative
    description: Join or create regional purchasing cooperatives to negotiate better rates for prescription drugs, medical supplies, and insurance premiums, leveraging collective bargaining power to reduce costs for residents and employers.
  references:
    issue: ISSUE-HEALTHCARE-HEALTHCARE_AFFORDABILITY_CRISIS
- type: Approach
  code: APPROACH-HEALTHCARE-HEALTHCARE_AFFORDABILITY_CRISIS-SLIDING_SCALE_COMMUNITY_HEALTH_PROGRAM
  attributes:
    title: Sliding Scale Community Health Program
    description: Establish income-based fee structures for municipal health services, expand community health center capacity, and provide prescription assistance programs for low and middle-income families.
  references:
    issue: ISSUE-HEALTHCARE-HEALTHCARE_AFFORDABILITY_CRISIS
- type: Approach
  code: APPROACH-HEALTHCARE-HEALTHCARE_AFFORDABILITY_CRISIS-HEALTHCARE_COST_TRANSPARENCY_INITIATIVE
  attributes:
    title: Healthcare Cost Transparency Initiative
    description: Require healthcare providers to publish transparent pricing, support price comparison tools, and advocate for state and federal legislation limiting surprise billing and promoting healthcare cost transparency.
  references:
    issue: ISSUE-HEALTHCARE-HEALTHCARE_AFFORDABILITY_CRISIS
- type: Issue
  code: ISSUE-HEALTHCARE-PUBLIC_HEALTH_EMERGENCY_PREPAREDNESS
  attributes:
    title: Public Health Emergency Preparedness
    description: Inadequate preparation for disease outbreaks, natural disasters, and health emergencies, including insufficient emergency medical supplies, coordination systems, and public health communication capabilities.
  references:
    topic: TOPIC-HEALTHCARE
- type: Approach
  code: APPROACH-HEALTHCARE-PUBLIC_HEALTH_EMERGENCY_PREPAREDNESS-COMPREHENSIVE_EMERGENCY_RESPONSE_SYSTEM
  attributes:
    title: Comprehensive Emergency Response System
    description: Develop integrated emergency response plans with hospitals, first responders, and public health agencies, maintain strategic medical supply reserves, and conduct regular emergency preparedness drills and training exercises.
  references:
    issue: ISSUE-HEALTHCARE-PUBLIC_HEALTH_EMERGENCY_PREPAREDNESS
- type: Approach
  code: APPROACH-HEALTHCARE-PUBLIC_HEALTH_EMERGENCY_PREPAREDNESS-PUBLIC_HEALTH_COMMUNICATION_NETWORK
  attributes:
    title: Public Health Communication Network
    description: Create multi-channel communication systems for health emergencies, including social media, mobile alerts, community liaisons, and multilingual messaging to ensure rapid and accurate information dissemination to all residents.
  references:
    issue: ISSUE-HEALTHCARE-PUBLIC_HEALTH_EMERGENCY_PREPAREDNESS
- type: Approach
  code: APPROACH-HEALTHCARE-PUBLIC_HEALTH_EMERGENCY_PREPAREDNESS-REGIONAL_HEALTH_SECURITY_PARTNERSHIP
  attributes:
    title: Regional Health Security Partnership
    description: Coordinate with neighboring jurisdictions, state agencies, and federal resources to create regional response capacity, share emergency resources, and develop mutual aid agreements for major health emergencies.
  references:
    issue: ISSUE-HEALTHCARE-PUBLIC_HEALTH_EMERGENCY_PREPAREDNESS
- type: Topic
  code: TOPIC-HOUSING_DEVELOPMENT
  attributes:
    title: Housing & Development
    description: Housing policies, affordable housing programs, zoning regulations, urban planning, homelessness services, and community development initiatives that ensure adequate shelter and sustainable growth.
- type: Issue
  code: ISSUE-HOUSING_DEVELOPMENT-AFFORDABLE_HOUSING_SHORTAGE
  attributes:
    title: Affordable Housing Shortage
    description: Severe shortage of affordable housing units has resulted in working families spending more than 30% of income on housing, increased homelessness, and young adults unable to purchase homes in their communities.
  references:
    topic: TOPIC-HOUSING_DEVELOPMENT
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-AFFORDABLE_HOUSING_SHORTAGE-INCLUSIONARY_HOUSING_ORDINANCE
  attributes:
    title: Inclusionary Housing Ordinance
    description: Require new residential developments to include a percentage of affordable units or pay in-lieu fees, while providing density bonuses and fast-track permitting for developers who exceed affordable housing requirements.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-AFFORDABLE_HOUSING_SHORTAGE
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-AFFORDABLE_HOUSING_SHORTAGE-COMMUNITY_LAND_TRUST_PROGRAM
  attributes:
    title: Community Land Trust Program
    description: Establish community land trusts to maintain permanent affordable housing, provide shared equity homeownership programs, and prevent gentrification by keeping land in community ownership while enabling resident homeownership.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-AFFORDABLE_HOUSING_SHORTAGE
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-AFFORDABLE_HOUSING_SHORTAGE-HOUSING_TRUST_FUND_DEVELOPMENT
  attributes:
    title: Housing Trust Fund Development
    description: Create dedicated revenue streams through real estate transfer taxes, development impact fees, or bond measures to fund affordable housing development, down payment assistance, and rental subsidy programs.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-AFFORDABLE_HOUSING_SHORTAGE
- type: Issue
  code: ISSUE-HOUSING_DEVELOPMENT-HOMELESSNESS_CRISIS
  attributes:
    title: Homelessness Crisis
    description: Rising numbers of individuals and families experiencing homelessness, with insufficient emergency shelter capacity, supportive services, and permanent housing solutions, particularly affecting veterans and mentally ill individuals.
  references:
    topic: TOPIC-HOUSING_DEVELOPMENT
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-HOMELESSNESS_CRISIS-HOUSING_FIRST_INITIATIVE
  attributes:
    title: Housing First Initiative
    description: Implement housing first approach providing immediate permanent housing without preconditions, combined with wraparound services including mental health treatment, substance abuse counseling, and job training programs.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-HOMELESSNESS_CRISIS
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-HOMELESSNESS_CRISIS-COMPREHENSIVE_PREVENTION_AND_RAPID_REHOUSING
  attributes:
    title: Comprehensive Prevention and Rapid Rehousing
    description: Develop prevention programs to help at-risk families avoid eviction, provide emergency rental assistance, and create rapid rehousing programs that quickly move homeless individuals into permanent housing with short-term support.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-HOMELESSNESS_CRISIS
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-HOMELESSNESS_CRISIS-COORDINATED_REGIONAL_HOMELESSNESS_RESPONSE
  attributes:
    title: Coordinated Regional Homelessness Response
    description: Create coordinated entry systems across the region, standardize data collection and tracking, and pool resources among jurisdictions to provide seamless services and eliminate duplication of efforts.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-HOMELESSNESS_CRISIS
- type: Issue
  code: ISSUE-HOUSING_DEVELOPMENT-GENTRIFICATION_AND_DISPLACEMENT
  attributes:
    title: Gentrification and Displacement
    description: Rapid neighborhood development is displacing long-term residents and small businesses through rising property values and rents, eroding community character and forcing out families who have lived in areas for generations.
  references:
    topic: TOPIC-HOUSING_DEVELOPMENT
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-GENTRIFICATION_AND_DISPLACEMENT-ANTI_DISPLACEMENT_PROTECTION_PROGRAM
  attributes:
    title: Anti-Displacement Protection Program
    description: Implement tenant protection ordinances including just-cause eviction requirements, rent stabilization measures, and relocation assistance for displaced residents, while preserving existing affordable housing stock.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-GENTRIFICATION_AND_DISPLACEMENT
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-GENTRIFICATION_AND_DISPLACEMENT-COMMUNITY_BENEFIT_AGREEMENTS
  attributes:
    title: Community Benefit Agreements
    description: Require developers of major projects to negotiate community benefit agreements ensuring local hiring, affordable housing inclusion, small business protection, and community facility improvements that benefit existing residents.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-GENTRIFICATION_AND_DISPLACEMENT
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-GENTRIFICATION_AND_DISPLACEMENT-CULTURAL_HERITAGE_PRESERVATION_INITIATIVE
  attributes:
    title: Cultural Heritage Preservation Initiative
    description: Protect culturally significant businesses and institutions through commercial rent stabilization, facade improvement grants, and zoning protections that maintain neighborhood character while allowing appropriate development.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-GENTRIFICATION_AND_DISPLACEMENT
- type: Issue
  code: ISSUE-HOUSING_DEVELOPMENT-ZONING_AND_DEVELOPMENT_BARRIERS
  attributes:
    title: Zoning and Development Barriers
    description: Outdated zoning laws and lengthy permitting processes are preventing development of mixed-income housing, transit-oriented development, and adaptive reuse projects that could address housing needs more effectively.
  references:
    topic: TOPIC-HOUSING_DEVELOPMENT
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-ZONING_AND_DEVELOPMENT_BARRIERS-ZONING_CODE_MODERNIZATION
  attributes:
    title: Zoning Code Modernization
    description: Update zoning codes to allow mixed-use development, reduce parking requirements, enable accessory dwelling units, and streamline approval processes for sustainable and affordable housing development.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-ZONING_AND_DEVELOPMENT_BARRIERS
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-ZONING_AND_DEVELOPMENT_BARRIERS-DEVELOPMENT_FAST_TRACK_PROGRAM
  attributes:
    title: Development Fast-Track Program
    description: Create expedited permitting processes for projects meeting affordability, sustainability, or community benefit criteria, with dedicated staff, clear timelines, and reduced fees to incentivize desired development types.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-ZONING_AND_DEVELOPMENT_BARRIERS
- type: Approach
  code: APPROACH-HOUSING_DEVELOPMENT-ZONING_AND_DEVELOPMENT_BARRIERS-FORM_BASED_ZONING_IMPLEMENTATION
  attributes:
    title: Form-Based Zoning Implementation
    description: Replace traditional use-based zoning with form-based codes that focus on building design and pedestrian-friendly development, enabling more flexible and context-sensitive development patterns.
  references:
    issue: ISSUE-HOUSING_DEVELOPMENT-ZONING_AND_DEVELOPMENT_BARRIERS
- type: Topic
  code: TOPIC-TRANSPORTATION
  attributes:
    title: Transportation
    description: Transportation infrastructure, public transit systems, traffic management, pedestrian and bicycle safety, and mobility planning that enables efficient movement of people and goods throughout the community.
- type: Issue
  code: ISSUE-TRANSPORTATION-TRAFFIC_CONGESTION
  attributes:
    title: Traffic Congestion
    description: Chronic traffic congestion during peak hours increases commute times, air pollution, fuel costs, and economic productivity losses, while creating safety hazards and reducing quality of life for residents.
  references:
    topic: TOPIC-TRANSPORTATION
- type: Approach
  code: APPROACH-TRANSPORTATION-TRAFFIC_CONGESTION-INTELLIGENT_TRANSPORTATION_MANAGEMENT_SYSTEM
  attributes:
    title: Intelligent Transportation Management System
    description: Implement adaptive traffic signal systems, real-time traffic monitoring, and coordinated signal timing to optimize traffic flow, reduce wait times, and improve overall transportation efficiency throughout the network.
  references:
    issue: ISSUE-TRANSPORTATION-TRAFFIC_CONGESTION
- type: Approach
  code: APPROACH-TRANSPORTATION-TRAFFIC_CONGESTION-CONGESTION_PRICING_AND_DEMAND_MANAGEMENT
  attributes:
    title: Congestion Pricing and Demand Management
    description: Introduce congestion pricing in high-traffic areas during peak hours, promote flexible work schedules, enhance carpooling programs, and incentivize off-peak travel to reduce traffic volume during rush hours.
  references:
    issue: ISSUE-TRANSPORTATION-TRAFFIC_CONGESTION
- type: Approach
  code: APPROACH-TRANSPORTATION-TRAFFIC_CONGESTION-COMPLETE_STREETS_INFRASTRUCTURE_UPGRADE
  attributes:
    title: Complete Streets Infrastructure Upgrade
    description: Redesign streets to accommodate multiple transportation modes including dedicated bus lanes, protected bike lanes, wider sidewalks, and transit signal priority to provide alternatives to single-occupancy vehicle travel.
  references:
    issue: ISSUE-TRANSPORTATION-TRAFFIC_CONGESTION
- type: Issue
  code: ISSUE-TRANSPORTATION-PUBLIC_TRANSIT_INADEQUACY
  attributes:
    title: Public Transit Inadequacy
    description: Limited public transportation options with infrequent service, poor route coverage, and unreliable schedules that fail to serve low-income residents and reduce car dependency effectively.
  references:
    topic: TOPIC-TRANSPORTATION
- type: Approach
  code: APPROACH-TRANSPORTATION-PUBLIC_TRANSIT_INADEQUACY-BUS_RAPID_TRANSIT_SYSTEM
  attributes:
    title: Bus Rapid Transit System
    description: Develop bus rapid transit with dedicated lanes, level boarding, off-board fare payment, and frequent service to provide fast, reliable transit that rivals rail systems at lower cost and with greater route flexibility.
  references:
    issue: ISSUE-TRANSPORTATION-PUBLIC_TRANSIT_INADEQUACY
- type: Approach
  code: APPROACH-TRANSPORTATION-PUBLIC_TRANSIT_INADEQUACY-TRANSIT_SERVICE_EXPANSION_AND_IMPROVEMENT
  attributes:
    title: Transit Service Expansion and Improvement
    description: Increase bus frequency, extend service hours, add routes to underserved areas, and upgrade bus stops with real-time arrival information, weather protection, and improved accessibility features.
  references:
    issue: ISSUE-TRANSPORTATION-PUBLIC_TRANSIT_INADEQUACY
- type: Approach
  code: APPROACH-TRANSPORTATION-PUBLIC_TRANSIT_INADEQUACY-INTEGRATED_MOBILITY_HUB_NETWORK
  attributes:
    title: Integrated Mobility Hub Network
    description: Create multimodal transportation hubs connecting bus, rail, bike share, ride share, and pedestrian facilities with seamless transfers, unified payment systems, and complementary services like retail and charging stations.
  references:
    issue: ISSUE-TRANSPORTATION-PUBLIC_TRANSIT_INADEQUACY
- type: Issue
  code: ISSUE-TRANSPORTATION-PEDESTRIAN_AND_BICYCLE_SAFETY
  attributes:
    title: Pedestrian and Bicycle Safety
    description: High rates of pedestrian and cyclist injuries and fatalities due to inadequate sidewalks, bike lanes, crosswalks, and traffic calming measures, particularly near schools and in dense neighborhoods.
  references:
    topic: TOPIC-TRANSPORTATION
- type: Approach
  code: APPROACH-TRANSPORTATION-PEDESTRIAN_AND_BICYCLE_SAFETY-VISION_ZERO_SAFETY_INITIATIVE
  attributes:
    title: Vision Zero Safety Initiative
    description: Implement comprehensive Vision Zero program with traffic calming measures, protected bike lanes, improved crosswalks, speed limit reductions, and enhanced enforcement to eliminate traffic fatalities and serious injuries.
  references:
    issue: ISSUE-TRANSPORTATION-PEDESTRIAN_AND_BICYCLE_SAFETY
- type: Approach
  code: APPROACH-TRANSPORTATION-PEDESTRIAN_AND_BICYCLE_SAFETY-SAFE_ROUTES_TO_SCHOOL_PROGRAM
  attributes:
    title: Safe Routes to School Program
    description: Create safe walking and biking routes to schools through infrastructure improvements, crossing guards, safety education, and encouragement programs that reduce vehicle traffic and promote active transportation for students.
  references:
    issue: ISSUE-TRANSPORTATION-PEDESTRIAN_AND_BICYCLE_SAFETY
- type: Approach
  code: APPROACH-TRANSPORTATION-PEDESTRIAN_AND_BICYCLE_SAFETY-COMPLETE_BICYCLE_INFRASTRUCTURE_NETWORK
  attributes:
    title: Complete Bicycle Infrastructure Network
    description: Build connected network of protected bike lanes, multi-use trails, secure bike parking, and maintenance stations to create safe, convenient cycling infrastructure that serves commuters and recreational users.
  references:
    issue: ISSUE-TRANSPORTATION-PEDESTRIAN_AND_BICYCLE_SAFETY
- type: Issue
  code: ISSUE-TRANSPORTATION-TRANSPORTATION_INFRASTRUCTURE_DETERIORATION
  attributes:
    title: Transportation Infrastructure Deterioration
    description: Crumbling roads, bridges, and transit infrastructure requiring costly repairs and creating safety hazards, with insufficient funding for systematic maintenance and modern upgrades.
  references:
    topic: TOPIC-TRANSPORTATION
- type: Approach
  code: APPROACH-TRANSPORTATION-TRANSPORTATION_INFRASTRUCTURE_DETERIORATION-ASSET_MANAGEMENT_AND_SYSTEMATIC_MAINTENANCE
