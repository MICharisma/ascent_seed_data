# Labels that are qualified New York parties for the 2026 general election. Any other label
# printed on a New York line belongs to an independent body nominated by petition and is
# converted as a political designation.
#
# A party qualifies by receiving the greater of 130,000 votes or 2% of the vote in the previous
# gubernatorial or presidential election. Source (secondary; confirm against the State Board of
# Elections before relying on it): https://en.wikipedia.org/wiki/Qualified_New_York_political_parties
qualified:
  - label: Democratic
    code: DEMOCRATIC
  - label: Republican
    code: REPUBLICAN
  - label: Conservative
    code: CONSERVATIVE
  - label: Working Families
    code: WORKING_FAMILIES
other_labels: designation
