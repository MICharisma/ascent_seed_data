# Connecticut's towns by planning region, the county-equivalents the Census Bureau has used since 2022.
# Connecticut has had no county government since 1960, and neither its eight historical counties nor these
# regions hold elections; the regions are where its nine councils of governments work. When a state has this
# file, the converter takes each town's county from it instead of the county a ballot row prints.
# Codes match manifests/contributions/ascent-clerk/us_counties.yml.
# Source: US Census Bureau, 2024 Gazetteer Files for Connecticut, retrieved 2026-10-21:
#   https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer/2024_gaz_counties_09.txt
#   https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer/2024_gaz_cousubs_09.txt
